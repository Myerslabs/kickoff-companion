# The test machine (owner 2026-11-15: "GitHub runs the whole suite on every pushed branch"): every test, the page tests that
# need Node included, on GitHub's Windows machines for each push, so the game-day host never carries the load.
# A red or green mark shows on the branch and its commits; main moves only when a part passes.
name: tests

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check app tools tests
      - name: Every test
        run: python -m pytest -n auto -q -rfE
