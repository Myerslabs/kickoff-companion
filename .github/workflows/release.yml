# The packaged program (public release Phase 10; Windows only since Kickoff Companion 2.0): one Windows archive attached
# to each GitHub release, the program signed through SignPath when the repository is set up for it. Runs only in the
# public repository (kickoff-companion), when a release is published or by hand (then the archive is a workflow
# artifact and nothing is published). tools/package/build.py does the program: PyInstaller, a smoke test of the built
# program, the archive with its SHA-256. The package on PyPI stays at 1.0.1 (the last release for macOS and Linux).
#
# Dormant until the repository is set up for it (README, "Code signing policy"):
#   SignPath  the repository variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN, once SignPath
#             Foundation has approved the project (slug kickoff-companion; policies test-signing and release-signing).
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event.repository.name == 'kickoff-companion'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: The release tag must carry the app's version
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --frozen --no-dev python - <<'EOF'
          import os
          import sys

          from app import __version__

          tag = os.environ["TAG"].lstrip("v")
          if tag != __version__:
              sys.exit(f"The tag says {tag} but app/__init__.py says {__version__}: bump __version__ before releasing.")
          print(f"Version {__version__} matches the tag.")
          EOF
      - name: Install the build group
        run: uv sync --frozen --no-dev --group build
      - name: Build and smoke-test the program
        run: uv run --frozen --no-dev --group build python tools/package/build.py --dist dist --no-archive
      - name: Keep the unsigned Windows program for signing
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: dist/KickoffCompanion
          if-no-files-found: error
      - name: Sign the Windows program through SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: kickoff-companion
          signing-policy-slug: ${{ github.event_name == 'release' && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Put the signed program in place
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist/KickoffCompanion
          Move-Item signed dist/KickoffCompanion
      - name: Smoke-test and archive the program as it ships
        run: uv run --frozen --no-dev --group build python tools/package/build.py --dist dist --archive-only
      - name: Attach the archive to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" dist/KickoffCompanion-*.zip dist/*.sha256 --clobber
      - name: Keep the archive as an artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: KickoffCompanion-windows
          path: |
            dist/KickoffCompanion-*

