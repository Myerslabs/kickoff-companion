# Kickoff Companion. Public release Phase 4: the dependencies live here, locked in uv.lock, so one
# command sets up any OS: `uv sync` (or just run start.ps1 / start.sh, which does it). requirements.txt
# and requirements-dev.txt carry the same pins for plain pip; tests/test_packaging.py keeps them in step.
# Freeze wave F6 (2026-10-21): the same file builds the package on PyPI, so `uvx kickoff-companion` runs the app
# with nothing cloned: hatchling puts `app`, `static` and `.env.example` inside one `kickoff_companion` package
# (packaging/pypi/, the entry point), so nothing lands at the top level of an environment, and the version is read
# from app/__init__.py. `uv build` makes the wheel; the release workflow publishes it (trusted publishing).
[project]
name = "kickoff-companion"
dynamic = ["version"]
description = "A second-screen companion for watching your college football team, served from your own computer."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Myers Labs" }]
keywords = ["college football", "second screen", "game day", "CFBD", "home network"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "tzdata==2026.4",
  "cryptography==50.0.1",
  "zeroconf==0.151.5",
  "segno==1.6.6",
]

[project.urls]
Homepage = "https://github.com/Myerslabs/kickoff-companion"
Repository = "https://github.com/Myerslabs/kickoff-companion"
Issues = "https://github.com/Myerslabs/kickoff-companion/issues"
Releases = "https://github.com/Myerslabs/kickoff-companion/releases"

[project.scripts]
kickoff-companion = "kickoff_companion:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

# The wheel: one package, kickoff_companion/, holding the entry point (packaging/pypi/kickoff_companion/), the app
# package, the static files and the .env template, laid out as a checkout is, so app/paths.py finds the bundle
# the usual way and the `installed` marker sends .env, data/ and logs/ to the app-data folder.
[tool.hatch.build.targets.wheel]
include = ["/packaging/pypi/kickoff_companion", "/app", "/static"]  # anchored: a folder named app or static anywhere else stays out
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.sources]
"packaging/pypi" = ""
"app" = "kickoff_companion/app"
"static" = "kickoff_companion/static"

[tool.hatch.build.targets.wheel.force-include]
".env.example" = "kickoff_companion/.env.example"

[tool.hatch.build.targets.sdist]
include = ["/packaging/pypi", "/app", "/static", "/.env.example", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
  "ruff==0.16.9",
]
build = [
  # The packaged program (public release Phase 10): `uv sync --group build`, then `python tools/package/build.py`
  "pyinstaller==6.22.3",
]

[tool.uv]
package = false  # an app run as `python -m app`, not a library to install

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
  # Third-party deprecations raised inside Starlette's own TestClient module.
  # Revisit when bumping starlette in requirements.txt.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

# Phase 15: lint with `.\.venv\Scripts\python -m ruff check app tools tests` (ruff is in requirements-dev.txt).
# Errors, bug-prone patterns and import order; long lines are house style here.
[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "E731", "UP017", "UP042", "UP046", "UP047"]  # long lines, named lambdas and the newest syntax spellings are house style

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B905", "E741"]  # tests zip recorded lists of known length and use short names
"tools/make_sample_data.py" = ["B023", "E741"]  # a one-off generator; its closures run inside the loop

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "tools"]
